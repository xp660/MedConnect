services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medconnect
      MYSQL_USER: medconnect
      MYSQL_PASSWORD: medconnect
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - medconnect-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medconnect-mysql-data:
